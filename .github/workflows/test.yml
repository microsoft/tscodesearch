name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          uv python install
          uv sync --locked --managed-python

      - name: Write config.json
        run: echo '{"api_key":"ci-test-key","port":8108,"roots":{}}' > config.json

      - name: Run Python tests
        run: uv run --no-sync python -m pytest tests/ query/tests/ -v

      - name: Run Python invocation and MCP registration tests
        run: node --test tests/*.mjs

      - name: Run VS Code extension tests
        run: node run_tests.mjs
